apiVersion: batch/v1
kind: Job
metadata:
  name: imagenet-gdino-localization-unified
  namespace: wenglab-interpretable-ai
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: imagenet-gdino-localization-unified
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: ghcr.io/atharvrn/savlgcbm-cbm:pt222-cu121
          imagePullPolicy: Always
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euxo pipefail
              cd /workspace/GroundedCBM-test
              source /opt/conda/etc/profile.d/conda.sh || true
              export CUDA_VISIBLE_DEVICES=0
              python -m py_compile scripts/eval_gdino_localization.py
              python scripts/eval_gdino_localization.py \
                --dataset imagenet \
                --gcbm_path /workspace/savlg_imagenet_standalone_runs/savlg_imagenet_v1_alpha01_maskw1_conv5_resume5ep_from7_cpu24mem80_saga20_20260506T180953Z_savlg-v1-conv5-resume5ep-c24-m80-s20-lzz5p \
                --annotation_dir /workspace/imagenet_annotations \
                --val_root /workspace/imagenet_val_full \
                --output /workspace/GroundedCBM-test/results/imagenet_gdino_unified_full_20260512.json \
                --device cuda \
                --batch_size 128 \
                --num_workers 2 \
                --activation_thresholds 0.3,0.5,0.7,0.9 \
                --box_iou_thresholds 0.1,0.3,0.5 \
                --log_every 5000
          resources:
            requests:
              cpu: "8"
              memory: 24Gi
              ephemeral-storage: 100Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 24Gi
              ephemeral-storage: 100Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: dev-shm
              mountPath: /dev/shm
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: atharv-rwx-storage-1ti
        - name: dev-shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
