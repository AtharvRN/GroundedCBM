# Supervised ablation. Reuse exactly the GDINO run's image roster and split IDs.
dataset: partimagenetpp
data:
  prepared: prepared/partimagenetpp-human
  cache: /tmp/sgcbm-target-cache/partimagenetpp-human
  supervision: human
  input_size: 224
  resize_size: 256
  workers: 8
model:
  backbone: resnet50
  checkpoint: /path/to/partimagenetpp_backbone/best.pt
  stages: conv345
  width: 2048
  alpha: 0.1
training:
  stage: concept
  output: runs/partimagenetpp-human/seed42
  seed: 42
  device: cuda
  epochs: 75
  patience: 10
  min_epochs: 10
  batch_size: 32
  optimizer: adam
  lr: 0.0001
  weight_decay: 0.00001
  precision: fp16
  channels_last: true
  fused_bce: 1.0
  kl: 0.25
  spatial_bce: 0.25
  positive_weight: 1.0
