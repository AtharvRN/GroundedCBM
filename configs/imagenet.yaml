# Current paper's stated budget; historical checkpoints may have longer training histories.
dataset: imagenet
data:
  prepared: prepared/imagenet
  cache: /tmp/sgcbm-target-cache/imagenet
  input_size: 224
  resize_size: 256
  confidence: 0.15
  workers: 8
model:
  backbone: resnet50
  weights: IMAGENET1K_V1
  stages: conv345
  width: 2048
  alpha: 0.1
training:
  stage: concept
  output: runs/imagenet/seed42
  seed: 42
  device: cuda
  epochs: 20
  patience: 5
  min_epochs: 5
  batch_size: 128
  optimizer: adam
  lr: 0.0001
  weight_decay: 0.00001
  precision: fp16
  channels_last: true
  fused_bce: 1.0
  kl: 0.25
  spatial_bce: 0.25
  positive_weight: 100.0
  concept_bce_reduction: mean
  filter_concepts: false
