# CUB recipe under shared internal-validation selection; see docs/baselines.md.
dataset: cub
data:
  prepared: prepared/cub
  cache: /tmp/spatial-cbm/vlg-cub
model:
  method: vlg_cbm
  backbone: resnet18
  checkpoint: /path/to/cub_backbone.pt
  vlg_hidden: 0
training:
  output: runs/cub/vlg_cbm/seed42
  seed: 42
  epochs: 75
  patience: 10
  min_epochs: 10
  batch_size: 32
  optimizer: adam
  lr: 0.0005
  weight_decay: 0.00001
  precision: fp32
  positive_weight: 1.0
  vlg_crop_probability: 0.5
  kl: 0.0
  spatial_bce: 0.0
