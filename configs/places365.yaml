# Matched legacy-BCE recipe; exact reproduction also needs its prepared bank/split and backbone.
dataset: places365
data:
  prepared: prepared/places365
  cache: /tmp/sgcbm-target-cache/places365
  input_size: 224
  resize_size: 256
  confidence: 0.15
  workers: 8
model:
  backbone: resnet50
  checkpoint: /path/to/places365_backbone.pt
  stages: conv345
  width: 2048
  alpha: 0.1
training:
  stage: concept
  output: runs/places365/seed42
  seed: 42
  device: cuda
  epochs: 10
  patience: 5
  min_epochs: 1
  batch_size: 512
  evaluation_batch_size: 64
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  schedule: cosine
  min_lr: 0.000001
  precision: fp16
  channels_last: true
  fused_bce: 1.0
  kl: 1.0
  spatial_bce: 0.25
  positive_weight: 100.0
  concept_bce_reduction: weight_sum
  filter_concepts: false
