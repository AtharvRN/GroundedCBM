dataset: imagenet
model: vlg_cbm
train_root: /path/to/imagenet/train
annotation_dir: /path/to/imagenet_annotations
precomputed_target_dir: /path/to/precomputed_targets
concept_file: concept_files/imagenet_filtered.txt
save_dir: artifacts/imagenet
run_name: vlg_cbm_imagenet_v1_15ep
epochs: 15
batch_size: 256
workers: 16
prefetch_factor: 2
resnet50_weights: v1
input_size: 224
branch_arch: global_only
global_pos_weight: 100.0
loss_global_w: 1.0
loss_mask_w: 0.0
concept_threshold: 0.15
filter_concepts_by_count: false
concept_min_count: 1
concept_max_frequency: 1.0
optimizer: adamw
lr: 0.001
weight_decay: 0.0001
scheduler: cosine
amp: fp16
tf32: true
channels_last: true
cudnn_benchmark: true
pin_memory: true
persistent_workers: true
seed: 6885
train_glm_after_cbl: false
